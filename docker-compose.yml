services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"   # optional: lets you connect with Compass from your host
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "admin", "-p", "password123",
             "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mongodb-task-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:8080"     # http://localhost:5000/swagger
    environment:
      # Development so Swagger is enabled (your Program.cs only enables it in Development)
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Overrides appsettings.json ("__" maps to ":" in config keys).
      # Note the host is "mongodb" (the service name), not "localhost".
      MongoDb__ConnectionString: "mongodb://admin:password123@mongodb:27017/?authSource=admin"
      MongoDb__DatabaseName: "MongoLearningDb"
      MongoDb__UsersCollectionName: "users"
      APIOption__URL: "https://dummyjson.com/users"

volumes:
  mongo-data:
